<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Automotriz</title>
    <link rel="stylesheet" href="style.css">
    <!-- Librería para renderizar Markdown (negritas y listas de la IA) -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
    .btn-cerrar-sesion {
        width: auto !important; /* Mantenemos el tamaño pequeño */
        background: rgba(255, 77, 77, 0.1);
        border: 1px solid #ff4d4d;
        color: #ff4d4d;
        padding: 6px 15px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 13px;
        font-weight: bold;
        transition: all 0.3s ease-in-out;
        box-shadow: 0 0 5px rgba(255, 77, 77, 0.2);
    }

    .btn-cerrar-sesion:hover {
        background: rgba(255, 77, 77, 0.3);
        color: #ffffff;
        box-shadow: 0 0 15px rgba(255, 77, 77, 0.8), 0 0 30px rgba(255, 77, 77, 0.5);
        border-color: #ff1a1a;
        transform: translateY(-2px); /* Un pequeño salto hacia arriba */
    }
</style>
</head>
<body style="background-color: #121212; color: #ffffff; font-family: sans-serif;">

    <!-- PANTALLA DE LOGIN -->
    <div id="login-container" class="glass-container" style="max-width: 400px; margin: 100px auto; padding: 30px; text-align: center; border-radius: 15px; background: rgba(20, 20, 25, 0.8); box-shadow: 0 0 15px rgba(138, 43, 226, 0.5); border: 1px solid rgba(138, 43, 226, 0.3);">
        <h2 style="color: #fff; text-shadow: 0 0 5px #8a2be2;">Acceso al Sistema</h2>
        <p style="color: #ccc; margin-bottom: 20px;">Ingresa tus credenciales de taller</p>
        
        <input type="email" id="email_login" placeholder="Correo electrónico" style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box;">
        
        <input type="password" id="password_login" placeholder="Contraseña" style="width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; box-sizing: border-box;">
        
        <button onclick="iniciarSesion()" style="width: 100%; padding: 12px; border-radius: 8px; border: none; background: linear-gradient(45deg, #8a2be2, #4b0082); color: white; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(138, 43, 226, 0.6);">
            Ingresar al Taller
        </button>
        <p id="login_error" style="color: #ff4d4d; margin-top: 15px; display: none;"></p>
    </div>

    <!-- APLICACIÓN PRINCIPAL (Oculta hasta iniciar sesión) -->
    <div id="app-container" style="display: none;">
        <div class="contenedor">
            
            <!-- Barra superior para el botón de salir -->
            <div style="display: flex; justify-content: flex-end; margin-top: -15px; margin-bottom: 15px; width: 100%;">
                <button class="btn-cerrar-sesion" onclick="cerrarSesion()">
                    Cerrar Sesión
                </button>
            </div>

            <div class="cabecera">
                <h1>Autotronic Solutions IA</h1>
                <p>Keila IA le ayudará con la organización de gastos, ingresos, inventario y consultas analíticas.</p>
            </div>
            
            <div class="grupo-formulario">
                <textarea id="texto_reporte" placeholder="Escribe aquí un registro (ej: Entró Toyota PXY9876...) o haz una pregunta analítica (ej: ¿Cuál fue el cliente que gastó más?)"></textarea>
            </div>
            
            <button class="btn-enviar" onclick="enviarReporte()">
                Enviar a Keila IA
            </button>

            <hr>
            
            <div class="seccion-contabilidad">
                <h2>Panel de Control y Reportes</h2>
                <div class="grupo-botones-reportes">
                    <button class="btn-excel" onclick="descargarReporteDiario()">
                        Descargar Reporte Diario
                    </button>
                    <button class="btn-inventario" onclick="descargarInventario()">
                        Descargar Auditoria de Inventario
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
