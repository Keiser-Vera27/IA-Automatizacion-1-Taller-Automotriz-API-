<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0A0D26" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#F4F2FF" media="(prefers-color-scheme: light)">
    <title>Cotización</title>
    <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
    <style>
        /* ==================================================================
           Página pública que abre el CLIENTE del taller (sin iniciar sesión).
           Autocontenida: no depende del CSS de la aplicación.
           Tema holográfico nocturno (oscuro) con variante clara según el
           sistema del cliente. Diseñada primero para el celular, porque el
           link llega por WhatsApp.
           ================================================================== */
        @font-face {
            font-family: "Plus Jakarta Sans";
            src: url("fonts/plus-jakarta-sans-latin-wght-normal.woff2") format("woff2");
            font-weight: 200 800; font-display: swap;
        }
        :root {
            color-scheme: dark;
            --fondo: #0A0D26;
            --vidrio: rgba(255, 255, 255, 0.05); --vidrio-2: rgba(255, 255, 255, 0.08);
            --linea: rgba(255, 255, 255, 0.08); --linea-fuerte: rgba(255, 255, 255, 0.14);
            --tinta: #F4F2FF; --tinta-2: #C9C5E6; --tinta-3: #9A95BF;
            --holo: linear-gradient(120deg, #9BF3C9 0%, #D6F56A 38%, #F7E58A 55%, #F3A6E3 78%, #A58BFF 100%);
            --sobre-holo: #10122E;
            --violeta: #A58BFF;
            --ok: #9BF3C9; --ok-fondo: rgba(155, 243, 201, 0.12); --ok-borde: rgba(155, 243, 201, 0.45);
            --no: #FFA3B1; --no-fondo: rgba(255, 99, 120, 0.12); --no-borde: rgba(255, 138, 154, 0.45);
            --urgente: #FFA3B1; --urgente-fondo: rgba(255, 99, 120, 0.14);
            --recomendado: #F7D58A; --recomendado-fondo: rgba(247, 197, 106, 0.14);
            --opcional: #C9C5E6; --opcional-fondo: rgba(255, 255, 255, 0.08);
            --barra: rgba(14, 17, 48, 0.82);
            --sombra: 0 20px 50px rgba(0, 0, 0, 0.35);
        }
        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --fondo: #F4F2FF;
                --vidrio: #FFFFFF; --vidrio-2: #F7F5FF;
                --linea: #E6E2F5; --linea-fuerte: #D6D0EE;
                --tinta: #1E1B4B; --tinta-2: #4A4670; --tinta-3: #6E6992;
                --violeta: #5B3DF5;
                --ok: #127A4B; --ok-fondo: #E4F6EC; --ok-borde: #8FD6B1;
                --no: #B4233A; --no-fondo: #FCE9EC; --no-borde: #F0A7B3;
                --urgente: #B4233A; --urgente-fondo: #FCE9EC;
                --recomendado: #8A5A00; --recomendado-fondo: #FDF1D8;
                --opcional: #4A4670; --opcional-fondo: #EEEBF8;
                --barra: rgba(255, 255, 255, 0.88);
                --sombra: 0 14px 36px rgba(60, 40, 140, 0.10);
            }
        }
        * { box-sizing: border-box; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            margin: 0; min-height: 100dvh; color: var(--tinta); background: var(--fondo);
            font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 16px; line-height: 1.5;
        }
        /* Luces de fondo (solo en oscuro) */
        @media (prefers-color-scheme: dark) {
            body {
                background:
                    radial-gradient(60% 40% at 85% 0%, rgba(165, 139, 255, 0.28), transparent 70%),
                    radial-gradient(50% 35% at 0% 30%, rgba(112, 48, 239, 0.22), transparent 70%),
                    var(--fondo);
                background-attachment: fixed;
            }
        }
        main { max-width: 640px; margin: 0 auto; padding: 20px 16px 170px; }
        .vidrio {
            background: var(--vidrio); border: 1px solid var(--linea); border-radius: 22px;
            -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
        }
        .tenue { color: var(--tinta-3); }
        .num { font-variant-numeric: tabular-nums; }
        [hidden] { display: none !important; }

        /* ---------------- Cabecera: taller y vehículo ---------------- */
        .taller { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
        .taller-inicial {
            flex: none; width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center;
            font-weight: 800; color: var(--sobre-holo); background: var(--holo);
        }
        .taller-nombre { font-weight: 750; font-size: 1.05rem; line-height: 1.2; }
        .taller-sub { font-size: 13px; color: var(--tinta-3); }

        .saludo { font-size: 1.55rem; line-height: 1.2; font-weight: 800; letter-spacing: -0.02em; margin: 24px 0 6px; }
        .intro { margin: 0 0 18px; color: var(--tinta-2); font-size: 15px; }

        .vehiculo { display: flex; align-items: center; gap: 14px; padding: 14px 16px; }
        .vehiculo-datos { min-width: 0; }
        .vehiculo-modelo { font-weight: 700; }
        .vehiculo-sub { font-size: 13px; color: var(--tinta-3); }

        /* Placa ecuatoriana (misma idea que en la app) */
        .placa {
            flex: none; display: inline-flex; flex-direction: column; align-items: stretch; overflow: hidden;
            border-radius: 8px; background: #F4F4F6; border: 2px solid #1B1B1F; color: #111;
            font-weight: 800; font-size: 1.05rem; letter-spacing: 0.02em; line-height: 1; text-align: center;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }
        .placa::before {
            content: "ECUADOR"; display: block; background: #7030EF; color: #fff;
            font-size: 0.42em; letter-spacing: 0.28em; padding: 3px 6px 2px; font-weight: 700;
        }
        .placa span { padding: 4px 10px 5px; }

        /* Total cotizado (tarjeta holográfica) y vigencia */
        .resumen { display: grid; grid-template-columns: 1.3fr 1fr; gap: 10px; margin-top: 12px; }
        .total-holo {
            position: relative; overflow: hidden; padding: 16px; border-radius: 22px;
            background: var(--holo); color: var(--sobre-holo); box-shadow: 0 18px 40px rgba(165, 139, 255, 0.22);
        }
        .total-holo::after {
            content: ""; position: absolute; width: 140px; height: 140px; right: -50px; top: -60px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
        }
        .total-etiqueta { font-size: 13px; font-weight: 650; opacity: 0.75; }
        .total-valor { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
        .total-sub { font-size: 12.5px; opacity: 0.75; }
        .vigencia { padding: 14px 16px; display: grid; align-content: center; gap: 2px; }
        .vigencia-etiqueta { font-size: 12.5px; color: var(--tinta-3); font-weight: 600; }
        .vigencia-valor { font-weight: 750; }
        .vigencia-dias { font-size: 12.5px; color: var(--recomendado); font-weight: 650; }

        .nota { margin-top: 12px; padding: 14px 16px; border-left: 3px solid var(--violeta); border-radius: 18px; }
        .nota-titulo { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--tinta-3); font-weight: 700; margin-bottom: 4px; }
        .nota p { margin: 0; color: var(--tinta-2); white-space: pre-line; }

        /* ---------------- Trabajos ---------------- */
        .seccion { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 26px 0 10px; }
        .seccion h2 { margin: 0; font-size: 1.1rem; font-weight: 750; }
        .seccion p { margin: 2px 0 0; font-size: 13px; color: var(--tinta-3); }
        .btn-todo {
            flex: none; height: 38px; padding: 0 14px; border-radius: 999px; cursor: pointer;
            border: 1px solid var(--linea-fuerte); background: var(--vidrio-2); color: var(--tinta);
            font-family: inherit; font-weight: 650; font-size: 14px; line-height: 1;
        }
        .lista { display: grid; gap: 12px; }
        .item { padding: 16px; border-radius: 20px; transition: border-color 160ms, background 160ms; }
        .item.aprobado { border-color: var(--ok-borde); }
        .item.rechazado { border-color: var(--no-borde); }
        .item.rechazado .item-desc, .item.rechazado .item-precio { opacity: 0.6; }
        .item-cabecera { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
        .item-desc { font-weight: 650; line-height: 1.35; }
        .item-precio { font-weight: 800; font-size: 1.05rem; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .item-detalle { color: var(--tinta-3); font-size: 13px; margin-top: 2px; font-variant-numeric: tabular-nums; }
        .prioridad { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 3px 10px; border-radius: 999px; margin-bottom: 8px; }
        .prioridad.urgente { background: var(--urgente-fondo); color: var(--urgente); }
        .prioridad.recomendado { background: var(--recomendado-fondo); color: var(--recomendado); }
        .prioridad.opcional { background: var(--opcional-fondo); color: var(--opcional); }

        /* Decisión por trabajo: control segmentado */
        .decidir {
            display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 14px; padding: 4px;
            border-radius: 14px; background: var(--vidrio-2); border: 1px solid var(--linea);
        }
        .decidir button {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            height: 44px; border-radius: 11px; border: 1px solid transparent; background: transparent;
            color: var(--tinta-2); font-family: inherit; font-weight: 650; font-size: 15px; line-height: 1; cursor: pointer;
            transition: background 150ms, color 150ms, border-color 150ms;
        }
        .decidir svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
        .decidir button[aria-pressed="true"].si { background: var(--ok-fondo); border-color: var(--ok-borde); color: var(--ok); }
        .decidir button[aria-pressed="true"].no { background: var(--no-fondo); border-color: var(--no-borde); color: var(--no); }
        button:focus-visible, textarea:focus-visible { outline: 3px solid var(--violeta); outline-offset: 2px; }

        label.titulo { display: block; font-weight: 650; margin: 24px 0 8px; }
        textarea {
            width: 100%; min-height: 84px; border-radius: 16px; border: 1px solid var(--linea-fuerte);
            background: var(--vidrio); color: var(--tinta); padding: 12px 14px; font-family: inherit; font-size: 16px; resize: vertical;
        }
        textarea::placeholder { color: var(--tinta-3); }

        /* ---------------- Barra inferior fija ---------------- */
        .barra {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
            padding: 12px 16px calc(14px + env(safe-area-inset-bottom));
            background: var(--barra); border-top: 1px solid var(--linea-fuerte);
            -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%);
        }
        .barra-interior { max-width: 640px; margin: 0 auto; display: grid; gap: 10px; }
        .barra-fila { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .barra-total { font-variant-numeric: tabular-nums; line-height: 1.25; }
        .barra-total .tenue { font-size: 13px; }
        .barra-total b { display: block; font-size: 1.35rem; font-weight: 800; letter-spacing: -0.01em; }
        .progreso { height: 4px; border-radius: 4px; background: var(--linea-fuerte); overflow: hidden; }
        .progreso span { display: block; height: 100%; width: 0; background: var(--holo); transition: width 250ms ease; }
        .principal {
            flex: none; height: 50px; padding: 0 22px; border-radius: 999px; border: none; cursor: pointer;
            background: var(--holo); color: var(--sobre-holo); font-family: inherit; font-weight: 750; font-size: 16px; line-height: 1;
            box-shadow: 0 10px 26px rgba(165, 139, 255, 0.3);
        }
        .principal:disabled { background: var(--vidrio-2); color: var(--tinta-3); box-shadow: none; cursor: not-allowed; }
        .falta { color: var(--tinta-3); font-size: 13px; min-height: 18px; }
        .falta.confirmar { color: var(--tinta); font-weight: 600; }

        /* ---------------- Pantallas de estado ---------------- */
        .estado { text-align: center; padding: 28px 18px; margin-top: 6px; }
        .estado h2 { margin: 14px 0 6px; font-size: 1.3rem; font-weight: 800; letter-spacing: -0.01em; }
        .estado p { margin: 0; color: var(--tinta-2); }
        .icono-grande { width: 64px; height: 64px; border-radius: 50%; display: inline-grid; place-items: center; }
        .icono-grande svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
        .icono-grande.ok { background: var(--holo); color: var(--sobre-holo); }
        .icono-grande.aviso { background: var(--recomendado-fondo); color: var(--recomendado); }
        .resumen-lista { margin-top: 12px; padding: 6px 16px; }
        .resumen-linea { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--linea); }
        .resumen-linea:last-child { border-bottom: none; }
        .resumen-linea .desc { min-width: 0; display: grid; gap: 4px; }
        .resumen-linea b { font-variant-numeric: tabular-nums; white-space: nowrap; }
        .marca-dec { justify-self: start; font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
        .marca-dec.aprobado { background: var(--ok-fondo); color: var(--ok); }
        .marca-dec.rechazado { background: var(--no-fondo); color: var(--no); }
        .resumen-linea.total { font-weight: 750; }
        .resumen-linea.total b { font-size: 1.15rem; }

        .pie { text-align: center; color: var(--tinta-3); font-size: 12.5px; margin-top: 30px; }
        .cargando { display: grid; place-items: center; min-height: 60dvh; color: var(--tinta-3); }

        @media (min-width: 640px) {
            main { padding-top: 36px; }
            .saludo { font-size: 1.8rem; }
        }
        @media (max-width: 360px) {
            .resumen { grid-template-columns: minmax(0, 1fr); }
            .principal { padding: 0 16px; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; }
        }
    </style>
</head>
<body>
<main id="contenido" aria-live="polite"><p class="cargando">Cargando cotización...</p></main>
<div class="barra" id="barra" hidden>
    <div class="barra-interior">
        <div class="progreso" aria-hidden="true"><span id="progreso"></span></div>
        <div class="barra-fila">
            <div class="barra-total">
                <span class="tenue">Apruebas</span>
                <b id="total-aprobado">$0.00</b>
                <span class="tenue">de <span id="total-general">$0.00</span></span>
            </div>
            <button type="button" class="principal" id="btn-enviar" disabled>Enviar respuesta</button>
        </div>
        <div class="falta" id="falta" role="status"></div>
    </div>
</div>
<script>
    // ------------------------------------------------------------------
    // Cotización pública: el cliente aprueba o rechaza cada línea.
    // El token del link es la única "llave"; no hay datos personales aquí.
    // (La lógica y las llamadas al servidor son las mismas de antes;
    //  solo cambió cómo se ve.)
    // ------------------------------------------------------------------
    const token = new URLSearchParams(location.search).get('t') || '';
    const decisiones = {};          // id de línea -> 'aprobado' | 'rechazado'
    let cot = null;
    let confirmando = false;

    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const dinero = v => '$' + Number(v || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    const fecha = iso => iso ? new Date(String(iso).slice(0, 10) + 'T12:00:00').toLocaleDateString('es-EC', { day: 'numeric', month: 'long', year: 'numeric' }) : '';
    const cant = n => Number.isInteger(n) ? String(n) : String(n);
    const PRIORIDAD = { urgente: 'Urgente', recomendado: 'Recomendado', opcional: 'Opcional' };
    const svg = cuerpo => `<svg viewBox="0 0 24 24" aria-hidden="true">${cuerpo}</svg>`;
    const ICONO_OK = svg('<polyline points="20 6 9 17 4 12"/>');
    const ICONO_NO = svg('<path d="M6 6l12 12M18 6 6 18"/>');
    const ICONO_AVISO = svg('<line x1="12" y1="7" x2="12" y2="13"/><circle cx="12" cy="17" r="1"/>');

    // Días que faltan para que venza (0 = vence hoy)
    function diasParaVencer(iso) {
        if (!iso) return null;
        const hoy = new Date(); hoy.setHours(12, 0, 0, 0);
        return Math.round((new Date(String(iso).slice(0, 10) + 'T12:00:00') - hoy) / 86400000);
    }

    // Taller, número de cotización y vehículo
    function cabecera() {
        const inicial = String(cot.taller || '?').trim().charAt(0).toUpperCase();
        const vehiculo = cot.vehiculo || cot.modelo ? `
            <div class="vidrio vehiculo">
                ${cot.vehiculo ? `<span class="placa"><span>${esc(cot.vehiculo)}</span></span>` : ''}
                <div class="vehiculo-datos">
                    <div class="vehiculo-modelo">${esc(cot.modelo || 'Tu vehículo')}</div>
                    <div class="vehiculo-sub">Cotización N° ${esc(cot.id)}</div>
                </div>
            </div>` : '';
        return `
            <div class="taller">
                <span class="taller-inicial" aria-hidden="true">${esc(inicial)}</span>
                <div><div class="taller-nombre">${esc(cot.taller)}</div><div class="taller-sub">Cotización de servicio</div></div>
            </div>
            ${vehiculo}`;
    }

    function pantallaEstado(tipo, titulo, texto, extra = '') {
        document.getElementById('barra').hidden = true;
        document.getElementById('contenido').innerHTML = `${cot ? cabecera() : ''}
            <div class="vidrio estado"><span class="icono-grande ${tipo}">${tipo === 'ok' ? ICONO_OK : ICONO_AVISO}</span>
                <h2>${titulo}</h2><p>${texto}</p></div>${extra}
            <p class="pie">Cotización enviada por ${esc(cot ? cot.taller : 'el taller')}</p>`;
    }

    function resumenRespondida() {
        const filas = cot.items.map(i => `
            <div class="resumen-linea">
                <span class="desc"><span>${esc(i.descripcion)}${i.cantidad !== 1 ? ` (x${cant(i.cantidad)})` : ''}</span>
                    <span class="marca-dec ${esc(i.decision)}">${i.decision === 'aprobado' ? 'Aprobado' : 'No aprobado'}</span></span>
                <b>${dinero(i.subtotal)}</b>
            </div>`).join('');
        return `<div class="vidrio resumen-lista">${filas}
            <div class="resumen-linea total"><span>Total aprobado</span><b>${dinero(cot.total_aprobado)}</b></div></div>`;
    }

    function pintar() {
        if (cot.estado === 'respondida') {
            pantallaEstado('ok', 'Gracias, el taller recibió tu respuesta',
                `Respondiste el ${fecha(cot.respondido_en)}. Si necesitas cambiar algo, comunícate con el taller.`, resumenRespondida());
            return;
        }
        if (cot.vencida) {
            pantallaEstado('aviso', 'Esta cotización venció', `Era válida hasta el ${fecha(cot.vence)}. Pide al taller una cotización actualizada.`);
            return;
        }
        const nombre = String(cot.cliente || '').trim().split(/\s+/)[0];
        const dias = diasParaVencer(cot.vence);
        const textoDias = dias === null ? '' : dias <= 0 ? 'Vence hoy' : dias === 1 ? 'Vence mañana' : `Quedan ${dias} días`;
        const n = cot.items.length;

        const items = cot.items.map(i => {
            const dec = decisiones[i.id];
            return `
            <article class="vidrio item ${dec || ''}" data-id="${esc(i.id)}">
                ${PRIORIDAD[i.prioridad] ? `<span class="prioridad ${esc(i.prioridad)}">${PRIORIDAD[i.prioridad]}</span>` : ''}
                <div class="item-cabecera"><span class="item-desc">${esc(i.descripcion)}</span><span class="item-precio">${dinero(i.subtotal)}</span></div>
                ${i.cantidad !== 1 ? `<div class="item-detalle">${cant(i.cantidad)} × ${dinero(i.precio_unitario)}</div>` : ''}
                <div class="decidir" role="group" aria-label="Decisión para ${esc(i.descripcion)}">
                    <button type="button" class="si" aria-pressed="${dec === 'aprobado'}" onclick="decidir('${esc(i.id)}', 'aprobado')">${ICONO_OK}Aprobar</button>
                    <button type="button" class="no" aria-pressed="${dec === 'rechazado'}" onclick="decidir('${esc(i.id)}', 'rechazado')">${ICONO_NO}No por ahora</button>
                </div>
            </article>`;
        }).join('');

        document.getElementById('contenido').innerHTML = `${cabecera()}
            <h1 class="saludo">${nombre ? `Hola, ${esc(nombre)}` : 'Hola'}</h1>
            <p class="intro">Revisa los trabajos que recomendamos y elige cuáles autorizas. Solo se hará lo que apruebes.</p>

            <div class="resumen">
                <div class="total-holo">
                    <div class="total-etiqueta">Total cotizado</div>
                    <div class="total-valor num">${dinero(cot.total)}</div>
                    <div class="total-sub">${n === 1 ? '1 trabajo' : `${n} trabajos`}</div>
                </div>
                <div class="vidrio vigencia">
                    <span class="vigencia-etiqueta">Válida hasta</span>
                    <span class="vigencia-valor">${fecha(cot.vence)}</span>
                    ${textoDias ? `<span class="vigencia-dias">${textoDias}</span>` : ''}
                </div>
            </div>

            ${cot.nota ? `<div class="vidrio nota"><div class="nota-titulo">Nota del taller</div><p>${esc(cot.nota)}</p></div>` : ''}

            <div class="seccion">
                <div><h2>Trabajos</h2><p>Decide uno por uno</p></div>
                ${n > 1 ? '<button type="button" class="btn-todo" onclick="aprobarTodo()">Aprobar todo</button>' : ''}
            </div>
            <div class="lista">${items}</div>

            <label class="titulo" for="comentario">Comentario para el taller (opcional)</label>
            <textarea id="comentario" maxlength="500" placeholder="Ej. Lo de la suspensión lo hago el próximo mes"></textarea>
            <p class="pie">Cotización enviada por ${esc(cot.taller)}</p>`;
        document.getElementById('barra').hidden = false;
        document.getElementById('total-general').textContent = dinero(cot.total);
        actualizarBarra();
    }

    function decidir(id, valor) {
        decisiones[id] = valor;
        confirmando = false;
        const tarjeta = document.querySelector(`[data-id="${CSS.escape(id)}"]`);
        if (tarjeta) {
            tarjeta.classList.toggle('aprobado', valor === 'aprobado');
            tarjeta.classList.toggle('rechazado', valor === 'rechazado');
            tarjeta.querySelectorAll('.decidir button').forEach(b =>
                b.setAttribute('aria-pressed', String((b.classList.contains('si') ? 'aprobado' : 'rechazado') === valor)));
        }
        actualizarBarra();
    }

    function aprobarTodo() {
        cot.items.forEach(i => decidir(String(i.id), 'aprobado'));
    }

    function actualizarBarra() {
        const total = cot.items.filter(i => decisiones[i.id] === 'aprobado').reduce((s, i) => s + i.subtotal, 0);
        const respondidas = cot.items.filter(i => decisiones[i.id]).length;
        const faltan = cot.items.length - respondidas;
        document.getElementById('total-aprobado').textContent = dinero(total);
        document.getElementById('progreso').style.width = `${cot.items.length ? (respondidas / cot.items.length) * 100 : 0}%`;
        const btn = document.getElementById('btn-enviar');
        btn.disabled = faltan > 0;
        btn.textContent = confirmando ? 'Confirmar y enviar' : 'Enviar respuesta';
        const falta = document.getElementById('falta');
        falta.classList.toggle('confirmar', confirmando && !faltan);
        falta.textContent = faltan
            ? `Respondiste ${respondidas} de ${cot.items.length}. ${faltan === 1 ? 'Falta 1 trabajo.' : `Faltan ${faltan} trabajos.`}`
            : (confirmando ? `Vas a aprobar ${dinero(total)}. Toca otra vez para confirmar.` : 'Listo, ya puedes enviar tu respuesta.');
    }

    async function enviar() {
        // Primer toque: pide confirmar (evita envíos por accidente)
        if (!confirmando) { confirmando = true; actualizarBarra(); return; }
        const btn = document.getElementById('btn-enviar');
        btn.disabled = true; btn.textContent = 'Enviando...';
        try {
            const res = await fetch(`/publico/cotizaciones/${encodeURIComponent(token)}/responder`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ decisiones, comentario: (document.getElementById('comentario').value || '').trim() })
            });
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'No se pudo enviar. Intenta de nuevo.');
            cot = data;
            pintar();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (e) {
            confirmando = false;
            actualizarBarra();
            document.getElementById('falta').textContent = e.message;
        }
    }

    document.getElementById('btn-enviar').addEventListener('click', enviar);

    (async () => {
        try {
            const res = await fetch(`/publico/cotizaciones/${encodeURIComponent(token)}`);
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(typeof data.detail === 'string' ? data.detail : 'No se encontró la cotización.');
            cot = data;
            document.title = `Cotización ${cot.vehiculo || ''} de ${cot.taller}`.replace(/\s+/g, ' ');
            pintar();
        } catch (e) {
            pantallaEstado('aviso', 'No pudimos abrir la cotización', esc(e.message));
        }
    })();
</script>
</body>
</html>
