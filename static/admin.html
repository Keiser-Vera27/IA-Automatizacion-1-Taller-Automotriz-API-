<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Control Center - Autotronic</title>
    <link rel="stylesheet" href="admin_style.css">
</head>
<body>

    <!-- NOTIFICACIONES TOAST -->
    <div id="toast-container"></div>

    <!-- MODAL DE ACCIONES -->
    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-titulo" class="section-title">Acción</h3>
            <div id="modal-body" style="display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px;">
                <!-- Se llena dinámicamente -->
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-ghost" onclick="cerrarModal()">Cancelar</button>
                <button id="modal-btn-confirmar" class="btn-primary">Guardar</button>
            </div>
        </div>
    </div>

    <!-- LOGIN SUPERADMIN -->
    <div id="login-admin" style="max-width: 380px; margin: 100px auto; padding: 35px;" class="panel-box">
        <div class="logo-title" style="justify-content: center; margin-bottom: 25px;">
            <div class="logo-dot"></div>
            <span>Autotronic SaaS</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 15px;">
            <input type="email" id="admin_email" placeholder="Correo Master">
            <input type="password" id="admin_password" placeholder="Contraseña Master">
            <button class="btn-primary" onclick="loginAdmin()" style="width: 100%; margin-top: 10px;">Entrar al Panel</button>
        </div>
    </div>

    <!-- PANEL PRINCIPAL -->
    <div id="panel-admin" style="display: none;">
        <div class="header-bar">
            <div class="logo-title">
                <div class="logo-dot"></div>
                <span>Panel GEO'S SaaS</span>
            </div>
            <button class="btn-ghost" onclick="cerrarSesionAdmin()">Cerrar Sesión</button>
        </div>

        <!-- CONTENEDOR VISTA PRINCIPAL (Dashboard y Listado) -->
        <div id="vista-principal">
            
            <!-- DASHBOARD -->
            <div id="dashboard-section" class="panel-box" style="display: none;">
                <h3 class="section-title">Resumen Operativo</h3>
                <div class="metrics-grid">
                    
                    <!-- Tarjeta 1: Talleres -->
                    <div class="metric-card">
                        <h4>Talleres</h4>
                        <div class="metric-main-value" id="dash-total-workshops">--</div>
                        <div class="metric-sub-stats">
                            <span class="pill-badge pill-activo">Activos: <b id="dash-active-workshops">-</b></span>
                            <span class="pill-badge pill-suspendido">Suspendidos: <b id="dash-suspended-workshops">-</b></span>
                        </div>
                    </div>
                    
                    <!-- Tarjeta 2: Ingresos -->
                    <div class="metric-card">
                        <h4>Ingresos (MRR)</h4>
                        <div class="metric-main-value" style="color: var(--accent-green);" id="dash-mrr">$0</div>
                        <div class="metric-sub-stats">
                            <span class="pill-badge pill-plan">Activas: <b id="dash-active-subs">-</b></span>
                        </div>
                    </div>
                    
                    <!-- Tarjeta 3: Sistema y Monitor IA -->
                    <div class="metric-card">
                        <h4>Estado del Sistema</h4>
                        <div class="metric-main-value" id="dash-ai-today">-- <span style="font-size: 14px; font-weight:normal; color: var(--text-muted);">usos IA hoy</span></div>
                        <div class="metric-sub-stats">
                            <span class="pill-badge pill-suspendido">Errores: <b id="dash-errors">-</b></span>
                        </div>
                        <button class="btn-ghost" onclick="abrirMonitorIA()" style="width: 100%; margin-top: 15px; font-size: 12px;">Abrir Monitor de IA</button>
                    </div>

                </div> <!-- AQUI SE CIERRA LA CUADRÍCULA -->

                <!-- SECCIÓN DE ALERTAS PREVENTIVAS -->
                <div id="dashboard-alertas" style="margin-top: 30px; display: none;">
                    <h4 style="color: var(--text-muted); font-size: 13px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 15px;">🚨 Requieren tu Atención</h4>
                    <div id="lista-alertas" style="display: flex; flex-direction: column; gap: 10px;">
                        <!-- Las alertas se inyectarán aquí -->
                    </div>
                </div>
                
            </div> <!-- AQUI SE CIERRA EL DASHBOARD -->

            <!-- CREAR TALLER -->
            <div class="panel-box">
                <h3 class="section-title">Registrar Nuevo Taller Cliente</h3>
                <div class="form-alta-taller">
                    <input type="text" id="nuevo_nombre" placeholder="Nombre Taller">
                    <input type="email" id="nuevo_email" placeholder="Email Jefe">
                    <input type="password" id="nuevo_pass" placeholder="Password Jefe">
                    <select id="nuevo_plan">
                        <option value="mensual">Plan Mensual</option>
                        <option value="trimestral">Plan Trimestral</option>
                        <option value="anual">Plan Anual</option>
                    </select>
                    <button class="btn-primary" onclick="crearTaller()">Crear Taller</button>
                </div>
            </div>

            <h3 class="section-title">Talleres Registrados</h3>
            <div id="lista-talleres" class="talleres-grid">
                <!-- Cargado por JS -->
            </div>
            
        </div> <!-- AQUI SE CIERRA LA VISTA PRINCIPAL -->

        <!-- CONTENEDOR VISTA 360° -->
        <div id="vista-360-taller" style="display: none;">
            <button class="btn-ghost" onclick="cerrarVista360()" style="margin-bottom: 25px;">← Volver al panel principal</button>
            <div id="contenido-360">
                <!-- Cargado dinámicamente por JS -->
            </div>
        </div>

        <!-- CONTENEDOR NUEVO: VISTA MONITOR IA -->
        <div id="vista-monitor-ia" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
                <button class="btn-ghost" onclick="cerrarMonitorIA()">← Volver al panel</button>
                <button class="btn-primary" onclick="cargarColaIA()" style="padding: 8px 15px; font-size: 12px;">🔄 Actualizar</button>
            </div>
            
            <div class="panel-box">
                <h3 class="section-title">Monitor de Cola de Procesamiento</h3>
                <div id="lista-cola-ia" style="display: flex; flex-direction: column; gap: 12px;">
                    <!-- Se carga por JS -->
                </div>
            </div>
        </div>
        
    </div> <!-- AQUI SE CIERRA EL PANEL COMPLETO -->

    <script src="admin_script.js"></script>
</body>
</html>
